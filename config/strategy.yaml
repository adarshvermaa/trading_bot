assets:
  universe:
    - BTCUSD
    - ETHUSD


timeframes:
  - "15m"
  - "5m"
  - "1m"

indicators:
  ema_fast: 20
  ema_slow: 50
  rsi_period: 14
  atr_period: 14
  adx_period: 14
  adx_threshold: 25
  relative_volume_period: 20
  relative_volume_threshold: 1.5

structure:
  min_swing_lookback: 10
  bos_confirmation_candles: 2
  choch_confirmation_candles: 2
  liquidity_sweep_wick_ratio: 0.6
  displacement_body_ratio: 0.7
  retest_tolerance_atr_mult: 0.5
  fvg_min_atr_mult: 0.3

ml:
  model_path: "models/scalper_model.onnx"
  min_confidence: 0.65
  enabled: true

scanner:
  min_spread_bps: 10
  min_volume_usd: 50000
  score_weights:
    structure: 0.35
    regime: 0.20
    indicators: 0.25
    ml_confidence: 0.20

execution:
  order_type: "market"              # "market" for instant fills or "limit" for maker orders
  unfilled_timeout_seconds: 10      # Auto-cancel unfilled orders after 10 seconds
  use_orderbook_pricing: true       # When limit is used, cross spread at Best Ask (Buy) / Best Bid (Sell)
  max_slippage_bps: 15.0            # Max allowable spread/slippage before aborting
  obi_filter_enabled: true          # Filter entries using live Delta L2 orderbook imbalance
  obi_threshold: 0.30               # Maximum opposing orderbook imbalance tolerance (0.30 = 65/35 imbalance)

session:
  kill_zones_enabled: true          # Active session & kill zone tracking
  dead_zone_min_confidence: 0.75    # Heightened ML confidence during low-volume Asian chop
  standard_min_confidence: 0.65     # Standard ML confidence for London & NY Kill Zones

