assets:
  universe:
    - BTCUSD
    - ETHUSD
    - SOLUSD
    - XAUTUSD
    - PAXGUSD
    - DOGEUSD
    - ZECUSD
    - XRPUSD
    - BNBUSD
    - AVAXUSD
  presets:
    majors:
      - BTCUSD
      - ETHUSD
    top10:
      - BTCUSD
      - ETHUSD
      - SOLUSD
      - XAUTUSD
      - PAXGUSD
      - DOGEUSD
      - ZECUSD
      - XRPUSD
      - BNBUSD
      - AVAXUSD
    gold:
      - XAUTUSD
      - PAXGUSD

timeframes:
  - "5s"
  - "15s"
  - "30s"
  - "1m"
  - "3m"
  - "5m"
  - "15m"
  - "30m"
  - "45m"
  - "1h"
  - "4h"
  - "1d"

indicators:
  ema_fast: 20
  ema_slow: 50
  rsi_period: 14
  atr_period: 14
  adx_period: 14
  adx_threshold: 25
  relative_volume_period: 20
  relative_volume_threshold: 1.5
  cvd_period: 20
  vwap_stds: [1.0, 2.0, 3.0]
  squeeze_bb_mult: 2.0
  squeeze_kc_mult: 1.5
  ofi_threshold: 0.25

structure:
  min_swing_lookback: 10
  bos_confirmation_candles: 2
  choch_confirmation_candles: 2
  liquidity_sweep_wick_ratio: 0.6
  displacement_body_ratio: 0.7
  retest_tolerance_atr_mult: 0.5
  fvg_min_atr_mult: 0.3

ml:
  model_path: "models/scalper_model.onnx"
  min_confidence: 0.65
  enabled: true

scanner:
  min_spread_bps: 10
  min_volume_usd: 50000
  score_weights:
    structure: 0.35
    regime: 0.20
    indicators: 0.25
    ml_confidence: 0.20

parallel_scanner:
  enabled: true
  max_concurrent_workers: 10
  worker_timeout_seconds: 3.0
  enable_parallel_indicators: true

execution:
  order_type: "market"              # "market" for instant fills or "limit" for maker orders
  unfilled_timeout_seconds: 10      # Auto-cancel unfilled orders after 10 seconds
  use_orderbook_pricing: true       # When limit is used, cross spread at Best Ask (Buy) / Best Bid (Sell)
  max_slippage_bps: 15.0            # Max allowable spread/slippage before aborting
  obi_filter_enabled: true          # Filter entries using live Delta L2 orderbook imbalance
  obi_threshold: 0.30               # Maximum opposing orderbook imbalance tolerance (0.30 = 65/35 imbalance)

session:
  kill_zones_enabled: true          # Active session & kill zone tracking
  dead_zone_min_confidence: 0.75    # Heightened ML confidence during low-volume Asian chop
  standard_min_confidence: 0.65     # Standard ML confidence for London & NY Kill Zones

breakout:
  enabled: true                     # Enable institutional big-move breakout engine
  squeeze_bb_mult: 2.0              # Bollinger Bands std dev multiplier
  squeeze_kc_mult: 1.5              # Keltner Channels ATR multiplier
  volume_expansion_mult: 2.0        # Volume spike threshold relative to 20-SMA volume
  displacement_body_pct: 0.70       # Minimum body-to-range ratio for valid breakout displacement
  runner_mode_enabled: true         # Enable trend runner mode (exempt from 29m limit in trending regime)
  breakeven_r_mult: 2.0             # Move stop loss to breakeven (+0.1%) when profit >= 2.0R

jev:
  enabled: true                     # Enable TypeSafe Jev System One decision model
  model: "jev-latest"               # Model name (jev-latest or jev-1.13.0)
  timeout_ms: 1200                  # Max network timeout before local ONNX fallback
  min_confidence: 0.70              # Minimum directional confidence (0.0 to 1.0)
  max_trap_probability: 0.35        # Maximum allowed bull/bear trap probability (noul < 0.35)
  min_setup_grade: 2.5              # Minimum institutional setup grade (0.0 to 4.0)
  enable_active_monitoring: true    # Enable dynamic trade health & momentum evaluation
  enable_mistake_forensics: true    # Diagnose stopped-out trades and log to patterns.db
  enable_dynamic_sl_tp: true        # Enable Jev AI dynamic SL and TP resolution
  enable_dynamic_trailing: true     # Enable Jev AI dynamic trailing stop loss
  min_risk_reward_ratio: 1.8        # Minimum allowable mathematical Risk:Reward ratio
  target_risk_reward_ratio: 2.5     # Default institutional target Risk:Reward ratio
  max_risk_reward_ratio: 3.5        # Maximum expansion ceiling for runners
  trailing_interval_seconds: 5      # Seconds between dynamic trailing checks
