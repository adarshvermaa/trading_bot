capital:
  max_allocation_pct: 0.80
  reserve_pct: 0.20
  max_positions: 1

leverage:
  high_leverage_assets:
    - BTCUSD
    - ETHUSD
    - SOLUSD
    - XAUTUSD
    - PAXGUSD
    - DOGEUSD
    - XRPUSD
    - BNBUSD
    - AVAXUSD
  fixed_leverage: 25
  high_leverage_value: 25
  default_leverage_value: 20
  safe_fallback_leverage: 10
  reject_on_leverage_fail: false

dynamic_leverage:
  enabled: true
  fixed_leverage: 25
  min_leverage: 5
  max_leverage: 50
  tiers:
    win_win_apex: 50
    high_conviction: 30
    standard_scalp: 20
    defensive_probe: 10
  liquidation_buffer_ratio: 1.5
  volatility_throttle_threshold: 1.5
  drawdown_throttle_enabled: true

stop_loss:
  max_loss_pct_of_margin: 0.03
  min_stop_distance_atr: 0.05
  liquidation_buffer_ratio: 1.5

take_profit:
  target_pct_of_margin: 2.00
  target_pct_of_margin_max: 2.00
  min_risk_reward_ratio: 1.8
  target_risk_reward_ratio: 2.5
  max_risk_reward_ratio: 3.5

trailing_stop:
  enabled: true
  activation_pct_of_margin: 0.02
  buffer_pct_of_margin: 0.01
  max_profit_cap_pct_of_margin: 2.00
  scalper_offer_max_seconds_major: 1740  # 29 min (BTCUSD, ETHUSD) for Delta zero closing fee offer
  scalper_offer_max_seconds_other: 840   # 14 min for other futures

fees:
  taker_fee_pct: 0.0005
  maker_fee_pct: 0.0002
  estimated_slippage_pct: 0.001

daily_limits:
  max_daily_loss_pct: 0.03
  max_consecutive_losses: 5
  cooldown_seconds: 300

failsafe:
  stale_data_seconds: 30
  max_spread_bps: 15
  heartbeat_interval: 10
  reconnect_max_retries: 10
  reconnect_backoff_base: 2
