[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-scalping-bot"
version = "0.1.0"
description = "CLI crypto scalping bot with Delta Exchange market data + execution"
requires-python = ">=3.11"
dependencies = [
    "websockets>=12.0",
    "aiohttp>=3.9",
    "ccxt>=4.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "onnx>=1.15",
    "onnxruntime>=1.16",
    "skl2onnx>=1.16",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "litellm>=1.0",
    "tenacity>=8.2",
    "orjson>=3.9",
    "rich>=13.7",
]

[project.scripts]
crypto-scalper = "src.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

